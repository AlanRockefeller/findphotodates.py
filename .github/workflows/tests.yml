name: Tests

on:
  push:
    branches: [Main, test]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # The suite is developed on Linux. macOS and Windows runs report problems
    # without failing the workflow until they are known to pass there too.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"  # the oldest supported version
            experimental: false
          - os: ubuntu-latest
            python: "3.13"
            experimental: false
          - os: macos-latest
            python: "3.13"
            experimental: true
          - os: windows-latest
            python: "3.13"
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Install ExifTool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install ExifTool (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool --yes --no-progress
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run the tests
        run: python -m pytest -q
